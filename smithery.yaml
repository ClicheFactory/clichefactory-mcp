# Smithery.ai configuration file
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - CLICHEFACTORY_API_KEY
    properties:
      CLICHEFACTORY_API_KEY:
        type: string
        description: "ClicheFactory API key from Settings → API Keys (cliche-...). Free pages at clichefactory.com."
      LLM_MODEL_NAME:
        type: string
        description: "Optional — model name for local/BYOK mode only."
      LLM_API_KEY:
        type: string
        description: "Optional — LLM provider API key for local/BYOK mode only."
      OCR_MODEL_NAME:
        type: string
        description: "Optional OCR/VLM model override."
      OCR_API_KEY:
        type: string
        description: "Optional OCR/VLM provider API key."
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: ['clichefactory-mcp'],
      env: {
        CLICHEFACTORY_API_KEY: config.CLICHEFACTORY_API_KEY || '',
        LLM_MODEL_NAME: config.LLM_MODEL_NAME || '',
        LLM_API_KEY: config.LLM_API_KEY || '',
        OCR_MODEL_NAME: config.OCR_MODEL_NAME || '',
        OCR_API_KEY: config.OCR_API_KEY || ''
      }
    })
  exampleConfig:
    CLICHEFACTORY_API_KEY: "cliche-your-key-here"
